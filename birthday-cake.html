<style>
/* ─────────────────────────────────────────────────────────────
   配色：单主题深色。背景不是黑的 —— 原程序把参考图的四角各采了一遍，
   稳定落在 (0.098, 0.104, 0.125)，一层抬起来的蓝灰。页面底色取同一个值，
   画布和页面之间就没有接缝（手机安全区那两条留白也是这个色）。
   布局：画布铺满，问候语压在底部正中，左上角一行仪表式的操作提示。
   ───────────────────────────────────────────────────────────── */
:root{
  --bg:        #191b20;   /* 画布清屏色，逐位对齐，接缝不可见 */
  --bg-deep:   #0d0f13;   /* 加载遮罩，比底色再落一档 */
  --fg:        #eef2ff;
  --muted:     rgba(190,203,232,.55);
  --muted-dim: rgba(190,203,232,.30);
  --accent:    #5a82dc;   /* 问候语辉光的蓝，取自原程序的 TEXT_GLOW_RGB */
  --rule:      rgba(140,163,214,.16);

  --font-mono: "IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;

  color-scheme: dark;
}

html,body{height:100%;}
body{
  margin:0;
  background:var(--bg);
  color:var(--fg);
  font-family:var(--font-mono);
  overflow:hidden;
  overscroll-behavior:none;
}

#stage{position:fixed;inset:0;overflow:hidden;}
#gl{display:block;width:100%;height:100%;touch-action:none;cursor:grab;}
#gl.dragging{cursor:grabbing;}

/* ── 问候语 ─────────────────────────────────────────────────────
   这里是一张 canvas，不是 DOM 文字 —— 文字连同它那圈辉光整块烘在贴图里，
   贴图再用普通覆盖贴到屏幕上，所以一张 canvas 就够，理由见 buildGreet()。
   尺寸（含四周留白）由 JS 按屏幕比例算，这里只管摆位：
   水平居中，下边缘距屏幕底 GREET_MARGIN 像素。                        */
#greet{
  position:absolute;
  left:50%;
  bottom:calc(var(--greet-bottom,42px) + env(safe-area-inset-bottom, 0px));
  transform:translateX(-50%);
  display:block;
  pointer-events:none;
  user-select:none;
}

/* ── 操作提示 ───────────────────────────────────────────────────
   一行仪表读数：粒子数是这个作品真实的一组数（蛋糕 82000 / 光环 95000 / …），
   收到链接的人第一眼就知道这是什么、怎么动。                         */
#hud{
  position:absolute;
  top:calc(env(safe-area-inset-top, 0px) + 18px);
  left:18px;
  display:flex;
  flex-direction:column;
  gap:5px;
  font-size:11px;
  line-height:1.5;
  letter-spacing:.07em;
  color:var(--muted);
  text-shadow:0 1px 6px rgba(0,0,0,.85);
  pointer-events:none;
  user-select:none;
}
#hud .count{color:var(--fg);opacity:.82;}
#hud .count b{font-weight:500;font-variant-numeric:tabular-nums;}
#hud .keys{color:var(--muted);}
#hud .bar{
  width:34px;height:1px;background:var(--rule);margin:2px 0 3px;
}

/* ── 加载遮罩 ───────────────────────────────────────────────── */
#veil{
  position:absolute;inset:0;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:14px;
  background:var(--bg-deep);
  transition:opacity .75s ease .12s;
  z-index:5;
}
#veil.gone{opacity:0;pointer-events:none;}
#veil .dot{
  width:5px;height:5px;border-radius:50%;
  background:var(--accent);
  box-shadow:0 0 12px 2px rgba(90,130,220,.75);
  animation:breathe 1.5s ease-in-out infinite;
}
@keyframes breathe{0%,100%{opacity:.25;transform:scale(.8);}50%{opacity:1;transform:scale(1.15);}}
#veil .msg{font-size:11.5px;letter-spacing:.1em;color:var(--muted);font-variant-numeric:tabular-nums;}

#fallback{
  position:absolute;inset:0;display:none;
  align-items:center;justify-content:center;
  padding:24px;text-align:center;
  font-size:13px;line-height:1.9;color:var(--muted);
  background:var(--bg);
}
#fallback.show{display:flex;}

@media (prefers-reduced-motion: reduce){
  #veil .dot{animation:none;opacity:.8;}
  #veil{transition-duration:.01ms;}
}
@media (max-width:520px){
  #hud{font-size:10px;letter-spacing:.05em;}
}

<script>
(function(){
"use strict";

/* ══════════════════════════════════════════════════════════════════════════
   ① 配置区 —— 全部数值原样取自 birthday_cake.py 的「① 配置区」
   改参数改这里。注释里保留了几个关键值的来历，它们是调出来的卡点。
   ══════════════════════════════════════════════════════════════════════════ */

const WIN_W = 1000, WIN_H = 800;          // 参考分辨率，所有像素级参数按它标定
const BG = [0.098, 0.104, 0.125];         // 背景底色（从参考图四角采出来的）

// —— 粒子数量（合计 216760）——
const CAKE_COUNT = 82000;
const PLATE_COUNT = 28000;
const RING_COUNT = 95000;                 // 环要连成一笔，点数不能省
const STAR_COUNT = 1500;
const FLAME_COUNT = 5200;
const CANDLE_COUNT = 700;
const CONFETTI_COUNT = 3000;
const SPARK_COUNT = 460;
const NEBULA_COUNT = 900;
const TOTAL = CAKE_COUNT + PLATE_COUNT + RING_COUNT + STAR_COUNT +
              FLAME_COUNT + CANDLE_COUNT + CONFETTI_COUNT + SPARK_COUNT + NEBULA_COUNT;

// —— 粒子大小（像素）——
const CAKE_SIZE_RANGE     = [5, 9];
const PLATE_SIZE_RANGE    = [4, 9];
const RING_SIZE_RANGE     = [2, 4];
const FLAME_SIZE_RANGE    = [2, 5];
const CANDLE_POINT_SIZE   = 4;

const CONFETTI_SIZE_RANGE = [4, 17];

const NEBULA_SIZE_RANGE   = [20, 50];

// —— 点精灵贴图（程序生成，没有外部图片）——
const GLOW_TEX_SIZE = 32, GLOW_CORE = 0.38, GLOW_HALO = 1.40;
const STAR_TEX_SIZE = 32, STAR_TEX_CORE = 0.09, STAR_TEX_ARM = 0.12, STAR_TEX_FALLOFF = 1.5;

// —— 蛋糕几何 ——
const CAKE_R = 1.15, CAKE_H = 1.68, CAKE_Y = -1.05;
const CAKE_TOP_Y = CAKE_Y + CAKE_H;
const CAKE_TOP_DENSITY = 0.40;
const PLATE_R = 1.52, PLATE_Y = -1.16, PLATE_RIM_H = 0.075;

// —— 蛋糕颜色（照着参考图采样定的）——
const COL_ROYAL_BLUE   = [0.075, 0.145, 0.40];
const COL_MID_BLUE     = [0.26, 0.44, 1.00];
const SPECK_COLORS = [
  [1.00,0.93,0.74], [1.00,0.93,0.74], [1.00,0.93,0.74],
  [1.00,0.82,0.36], [0.80,0.88,1.00], [1.00,0.76,0.92],
];
const CAKE_SPECK_RATIO = 0.024;
const COL_GOLD_LIGHT  = [0.90, 0.66, 0.24];
const COL_CREAM       = [1.00, 0.94, 0.90];
const COL_CREAM_EDGE  = [1.00, 0.78, 0.44];
const COL_CREAM_GOLD  = [1.00, 0.76, 0.30];
const COL_PLATE       = [0.64, 0.68, 0.86];
const COL_PLATE_EDGE  = [0.74, 0.75, 0.92];
const GOLD_BAND_START = 0.58, GOLD_BAND_SPAN = 0.42;
const CAKE_SIDE_ALPHA = [0.70, 0.76];
const CAKE_TOP_ALPHA  = [0.66, 0.75];
const PLATE_ALPHA     = [0.60, 0.70];

// —— 彩色纸屑 ——
const CONFETTI_ALPHA = [0.30, 0.68];
const CONFETTI_COLORS = [
  [0.30,0.60,1.00], [0.40,0.90,1.00], [1.00,0.80,0.30],
  [1.00,0.60,0.20], [1.00,0.55,0.82], [0.95,0.96,1.00],
];
const CONFETTI_SPRAY = [-1.55, 0.95, 0.6];
const CONFETTI_SPRAY_R = 1.45, CONFETTI_SPRAY_RATIO = 0.28;
const SPARK_COLOR = [1.00, 0.86, 0.42], SPARK_ALPHA = [0.55, 0.95];

// —— 光环 ——
const RING_WIDTH = 0.0085;
// 每个轨道面 = (倾角, 中心高度, 该面占比, 面内各股)
// 每股 = (半径, 颜色, 透明度区间, 该股在面内的占比)
const RING_PLANES = [
  {tilt: 22.0, y0:  0.72, share: 0.28, strands: [
    {radius:1.420, rgb:[0.90,0.94,1.00], a:[0.29,0.41], share:0.62},
    {radius:1.438, rgb:[0.62,0.74,1.00], a:[0.13,0.20], share:0.38},
  ]},
  {tilt: 22.0, y0: -0.42, share: 0.26, strands: [
    {radius:1.372, rgb:[1.00,0.80,0.34], a:[0.30,0.45], share:0.58},
    {radius:1.354, rgb:[0.80,0.84,1.00], a:[0.13,0.20], share:0.42},
  ]},
  {tilt:-20.0, y0:  0.12, share: 0.24, strands: [
    {radius:1.520, rgb:[1.00,0.74,0.92], a:[0.15,0.22], share:1.00},
  ]},
  {tilt: 42.0, y0: -0.14, share: 0.22, strands: [
    {radius:1.480, rgb:[0.96,0.86,0.62], a:[0.10,0.15], share:1.00},
  ]},
];

// —— 蜡烛 ——
const CANDLE_POS = [0, CAKE_TOP_Y, 0];
const CANDLE_R = 0.055, CANDLE_H = 0.62;
const CANDLE_COLOR = [1.00, 0.62, 0.86], CANDLE_STRIPE = [1.00, 0.92, 0.98];
const CANDLE_ALPHA = [0.62, 0.95];

// —— 火焰 ——
const FLAME_POS = [0, CAKE_TOP_Y + CANDLE_H, 0];
const FLAME_HEIGHT = 0.68, FLAME_BASE_R = 0.18;
const FLAME_COL_BOTTOM = [1.00, 0.98, 0.72];
const FLAME_COL_MID    = [1.00, 0.72, 0.16];
const FLAME_COL_TOP    = [1.00, 0.30, 0.02];
const FLAME_RISE = [0.7, 1.5], FLAME_JITTER = 0.020, FLAME_SWIRL = 1.2;
const FLAME_DRIFT = 0.02, FLAME_TAPER = 1.10, FLAME_ALPHA = [0.22, 0.48];

// —— 背景星星 ——
const STAR_RADIUS = [8, 15], STAR_ALPHA = [0.25, 0.80], STAR_TWINKLE = [0.9, 2.4];

// —— 动画 ——
const ROT_SPEED = 18.0;                   // 蛋糕自转（度/秒）
const RING_WAVE_AMP = 0.075, RING_WAVE_SPEED = 1.9;
const RING_BREATH = 0.022,  RING_BREATH_SPEED = 1.3;
const RING_SPIN = -14.0;                  // 负号 = 反向转
const FLOAT_AMP = 0.03, FLOAT_FREQ = [0.5, 2.4];

// —— 星云背景 ——
const NEBULA_RADIUS = [3, 11], NEBULA_ALPHA = [0.025, 0.055];
const NEBULA_COLORS = [[0.55,0.20,1.0],[0.15,0.30,1.0],[0.70,0.20,0.95]];

// —— 辉光 ——
const BLOOM_THRESHOLD = 0.55, BLOOM_GAIN = 1.20;
const BLOOM_SIGMA_NEAR = 3.0, BLOOM_SIGMA_FAR = 6.5;
const BLOOM_W_ORIGINAL = 0.94, BLOOM_W_NEAR = 0.33, BLOOM_W_FAR = 0.18;

// —— 相机 ——
const CAM_DIST_START = 6.6;
const CAM_ZOOM_MIN = 3.0 / CAM_DIST_START, CAM_ZOOM_MAX = 20.0 / CAM_DIST_START;
const CAM_PITCH_START = 19.0, CAM_PITCH_MIN = -85.0, CAM_PITCH_MAX = 85.0;
const DRAG_SENS = 0.32, ZOOM_SENS = 0.6;
const FOV = 45.0, NEAR = 0.1, FAR = 100.0;
const CAM_FIT_HALF_W = 1.95;              // 窄屏时保证画得下这半个宽度（环半径 1.52）

const SEED = 20240913;                    // 固定随机种子：每次打开都一样


/* ══════════════════════════════════════════════════════════════════════════
   ② 通用工具 —— 对应 numpy 的 default_rng
   ══════════════════════════════════════════════════════════════════════════ */

function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
let rnd = mulberry32(SEED);

function uni(a, b, n){                    // rng.uniform(a, b, n)
  const o = new Float64Array(n);
  for (let i = 0; i < n; i++) o[i] = a + (b - a) * rnd();
  return o;
}
function unif(n){ const o = new Float64Array(n); for (let i=0;i<n;i++) o[i]=rnd(); return o; }
function nrm(mu, sd, n){                  // rng.normal(mu, sd, n)
  const o = new Float64Array(n);
  for (let i = 0; i < n; i++){
    const u1 = rnd() || 1e-12, u2 = rnd();
    o[i] = mu + sd * Math.sqrt(-2 * Math.log(u1)) * Math.cos(2 * Math.PI * u2);
  }
  return o;
}
function randSizes(n, range){             // 取整分档
  const o = new Float32Array(n);
  for (let i = 0; i < n; i++) o[i] = Math.round(range[0] + (range[1] - range[0]) * rnd());
  return o;
}
function pickIndices(n, k){               // rng.choice(n, k, replace=False)
  const idx = new Int32Array(n);
  for (let i = 0; i < n; i++) idx[i] = i;
  for (let i = 0; i < k; i++){
    const j = i + Math.floor(rnd() * (n - i));
    const t = idx[i]; idx[i] = idx[j]; idx[j] = t;
  }
  return idx.subarray(0, k);
}
const clip01 = v => v < 0 ? 0 : (v > 1 ? 1 : v);

function gaussianWeights(sigma, sigmasOut){
  const half = Math.max(1, Math.ceil(sigma * sigmasOut));
  const w = new Float64Array(half * 2 + 1);
  let sum = 0;
  for (let i = -half; i <= half; i++){
    const v = Math.exp(-(i * i) / (2 * sigma * sigma));
    w[i + half] = v; sum += v;
  }
  for (let i = 0; i < w.length; i++) w[i] /= sum;
  return {w: w, half: half};
}


/* ══════════════════════════════════════════════════════════════════════════
   ③ 粒子生成函数 —— 纯数学，与 birthday_cake.py 一一对应
   每个系统产出：
     pos  Float32Array(n*3)   位置
     col  Float32Array(n*4)   rgb + alpha
     size Float32Array(n)     屏幕像素大小
     anim Float32Array(n*4)   浮动相位/频率、闪烁频率/相位
   ══════════════════════════════════════════════════════════════════════════ */

function makeSys(n){
  return { n:n, pos:new Float32Array(n*3), col:new Float32Array(n*4),
           size:new Float32Array(n), anim:new Float32Array(n*4) };
}
// 给整组填上每颗粒子的浮动/闪烁参数
function fillAnim(sys, freqRange){
  for (let i = 0; i < sys.n; i++){
    sys.anim[i*4  ] = rnd() * Math.PI * 2;                                   // 相位
    sys.anim[i*4+1] = FREQ_LO + (FREQ_HI - FREQ_LO) * rnd();                 // 浮动频率
    sys.anim[i*4+2] = freqRange ? freqRange[0] + (freqRange[1]-freqRange[0])*rnd() : 0;
    sys.anim[i*4+3] = freqRange ? rnd() * Math.PI * 2 : 0;
  }
}
const FREQ_LO = 0.5, FREQ_HI = 2.4;


/* 圆柱侧面撒点，返回 theta 与归一化高度，好让颜色按位置算大理石纹 */
function cylinderSide(n, radius, yBottom, height){
  const th = new Float64Array(n), yj = nrm(0, 0.006, n);
  const pos = new Float32Array(n * 3), yn = new Float32Array(n);
  for (let i = 0; i < n; i++){
    const t = th[i] = rnd() * Math.PI * 2;
    const y = yBottom + (height) * rnd();
    const r = radius * (1 + yj[i]);
    pos[i*3] = r * Math.cos(t); pos[i*3+1] = y; pos[i*3+2] = r * Math.sin(t);
    yn[i] = (y - yBottom) / Math.max(height, 1e-6);
  }
  return {pos:pos, th:th, yn:yn};
}

/* 水平圆盘撒点（按面积均匀，所以半径取 sqrt） */
function disc(n, radius, yPlane, yJitter){
  const u = new Float64Array(n), th = new Float64Array(n), yj = nrm(0, yJitter, n);
  const pos = new Float32Array(n * 3);
  for (let i = 0; i < n; i++){
    const t = th[i] = rnd() * Math.PI * 2;
    const uu = u[i] = Math.sqrt(rnd());
    const r = radius * uu;
    pos[i*3] = r * Math.cos(t); pos[i*3+1] = yPlane + yj[i]; pos[i*3+2] = r * Math.sin(t);
  }
  return {pos:pos, u:u, th:th};
}

/* 侧面的花纹：宝蓝底 + 云斑，最上段压一圈被 θ 掐断的金。
   按位置算而不是随机撒色，所以旋转时纹路跟着一起转。 */
function marbleRGB(th, yn){
  const n = th.length, out = new Float32Array(n * 3);
  for (let i = 0; i < n; i++){
    const t = th[i], y = yn[i];

    // 三个低频正弦叠加：θ 和高度同量级，格子接近正方，出来才是圆斑
    const cloud = 0.50 * Math.sin(2.0*t + 1.1*y*Math.PI + 0.4)
                + 0.32 * Math.sin(3.7*t - 1.9*y*Math.PI + 2.3)
                + 0.18 * Math.sin(1.3*t + 3.1*y*Math.PI - 1.2);
    const blueT = Math.pow(clip01(0.5 + 0.80 * cloud), 1.4);

    // 金只出现在最上面那四成，并且被一个慢波掐出粗细
    const band  = Math.pow(clip01((y - GOLD_BAND_START) / GOLD_BAND_SPAN), 1.5);
    const drip  = 0.5 + 0.5 * Math.sin(2.6*t + 1.7*y*Math.PI + 0.9);
    const goldT = clip01(band * (0.20 + 1.25 * drip)) * 0.72;

    // 上亮下暗的竖直渐变：顶面是光源，柱身上段被它照着
    const grad = (0.52 + 0.60 * y) * (0.95 + 0.05 * rnd());

    for (let c = 0; c < 3; c++){
      const base = COL_ROYAL_BLUE[c] * (1 - blueT) + COL_MID_BLUE[c] * blueT;
      out[i*3+c] = clip01((base * (1 - goldT) + COL_GOLD_LIGHT[c] * goldT) * grad);
    }
  }
  return out;
}


/* ── 蛋糕主体：单层矮圆柱 ───────────────────────────────────────── */
function makeCake(){
  const sideArea = 2 * Math.PI * CAKE_R * CAKE_H;
  const topArea  = Math.PI * CAKE_R * CAKE_R;
  const nTop  = Math.floor(CAKE_COUNT * topArea / (sideArea + topArea) * CAKE_TOP_DENSITY);
  const nSide = CAKE_COUNT - nTop;
  const sys = makeSys(CAKE_COUNT);

  // —— 侧面 ——
  const cs = cylinderSide(nSide, CAKE_R, CAKE_Y, CAKE_H);
  const rgb = marbleRGB(cs.th, cs.yn);
  sys.pos.set(cs.pos.subarray(0, nSide*3), 0);
  for (let i = 0; i < nSide; i++){
    const a = CAKE_SIDE_ALPHA[0] + (CAKE_SIDE_ALPHA[1]-CAKE_SIDE_ALPHA[0]) * rnd();
    sys.col[i*4]   = rgb[i*3];
    sys.col[i*4+1] = rgb[i*3+1];
    sys.col[i*4+2] = rgb[i*3+2];
    sys.col[i*4+3] = a;
  }
  // 云母闪点：暖白为主，掺金、淡蓝、粉。透明度给到接近 1，够亮才闪得起来
  const nSpeck = Math.floor(nSide * CAKE_SPECK_RATIO);
  const idx = pickIndices(nSide, nSpeck);
  for (let k = 0; k < nSpeck; k++){
    const i = idx[k], c = SPECK_COLORS[Math.floor(rnd() * SPECK_COLORS.length)];
    const m = 0.85 + 0.15 * rnd();
    sys.col[i*4] = c[0]*m; sys.col[i*4+1] = c[1]*m; sys.col[i*4+2] = c[2]*m;
    sys.col[i*4+3] = 0.85 + 0.15 * rnd();
  }
  const sSide = randSizes(nSide, CAKE_SIZE_RANGE);
  sys.size.set(sSide, 0);

  // —— 顶面：奶白底 + 两道低频波扫出来的金漩涡 + 最外沿一圈金 ——
  const t = disc(nTop, CAKE_R, CAKE_TOP_Y, 0.006);
  sys.pos.set(t.pos, nSide * 3);
  for (let i = 0; i < nTop; i++){
    const T = t.th[i], u = t.u[i];
    const sw = 0.55 * Math.sin(2.3*T + 3.2*u*Math.PI + 0.7)
             + 0.45 * Math.sin(3.9*T - 5.1*u*Math.PI + 2.4);
    const mix = clip01((sw + 0.10) / 0.40) * 0.82;
    const e = clip01((u - 0.82) / 0.18);
    const m = 0.95 + 0.05 * rnd();
    for (let c = 0; c < 3; c++){
      const v = COL_CREAM[c] * (1 - mix) + COL_CREAM_GOLD[c] * mix;
      sys.col[(nSide+i)*4+c] = clip01((v * (1 - e) + COL_CREAM_EDGE[c] * e) * m);
    }
    sys.col[(nSide+i)*4+3] = CAKE_TOP_ALPHA[0] + (CAKE_TOP_ALPHA[1]-CAKE_TOP_ALPHA[0]) * rnd();
  }
  sys.size.set(randSizes(nTop, CAKE_SIZE_RANGE), nSide);

  fillAnim(sys);
  return {sys:sys, floatAmp:FLOAT_AMP};
}


/* ── 底盘：一块比蛋糕大的扁圆盘，边缘一圈微微翘起 ───────────────── */
function makePlate(){
  const nFace = Math.floor(PLATE_COUNT * 0.88), nRim = PLATE_COUNT - nFace;
  const sys = makeSys(PLATE_COUNT);

  const f = disc(nFace, PLATE_R * 0.93, PLATE_Y, 0.004);
  sys.pos.set(f.pos, 0);
  for (let i = 0; i < nFace; i++){
    // 盘面基本是平的，只带一点点外沿积光 —— 给多了就成了又一个甜甜圈
    const m = 0.92 + 0.08 * rnd();
    for (let c = 0; c < 3; c++) sys.col[i*4+c] = COL_PLATE[c] * m;
    const a = PLATE_ALPHA[0] + (PLATE_ALPHA[1]-PLATE_ALPHA[0]) * rnd();
    sys.col[i*4+3] = clip01(a * (0.92 + 0.16 * f.u[i]));
  }
  sys.size.set(randSizes(nFace, PLATE_SIZE_RANGE), 0);

  // 盘沿：半径收窄的一圈，微微翘起，只比盘面亮一档
  const rrj = nrm(0, 0.012, nRim);
  for (let i = 0; i < nRim; i++){
    const idx = nFace + i;
    const th = rnd() * Math.PI * 2;
    const r = PLATE_R * (1 + rrj[i]);
    const y = PLATE_Y + PLATE_RIM_H * Math.pow(rnd(), 2);
    sys.pos[idx*3] = r * Math.cos(th);
    sys.pos[idx*3+1] = y;
    sys.pos[idx*3+2] = r * Math.sin(th);
    const m = 0.85 + 0.15 * rnd();
    for (let c = 0; c < 3; c++) sys.col[idx*4+c] = COL_PLATE_EDGE[c] * m;
    sys.col[idx*4+3] = PLATE_ALPHA[1] * (1.05 + 0.40 * rnd());
  }
  sys.size.set(randSizes(nRim, PLATE_SIZE_RANGE), nFace);

  fillAnim(sys);
  return {sys:sys, floatAmp:0.0};
}


/* ── 光环：几条倾斜的弧带，宽窄一路在变 ─────────────────────────
   几何参数（θ、倾角、基准半径/高度、相位）全部带给着色器，
   每帧在 GPU 上重算 —— 波峰沿弧长跑，才是「带子在飘」。 */
function makeRing(){
  const sys = makeSys(RING_COUNT);
  const A = new Float32Array(RING_COUNT * 4);   // y0, r, theta, ct
  const B = new Float32Array(RING_COUNT * 4);   // st, ph_v, ph_r, amp

  const shareSum = RING_PLANES.reduce((s,p) => s + p.share, 0);
  const planeN = RING_PLANES.map(p => Math.floor(p.share / shareSum * RING_COUNT));
  planeN[planeN.length-1] = RING_COUNT - planeN.slice(0,-1).reduce((a,b)=>a+b,0);

  let w = 0;
  for (let pi = 0; pi < RING_PLANES.length; pi++){
    const P = RING_PLANES[pi], pn = planeN[pi];
    const sw = P.strands.reduce((s,x) => s + x.share, 0);
    const cts = P.strands.map(x => Math.floor(x.share / sw * pn));
    cts[cts.length-1] = pn - cts.slice(0,-1).reduce((a,b)=>a+b,0);

    const tilt = P.tilt * Math.PI / 180, ct = Math.cos(tilt), st = Math.sin(tilt);
    // 每条轨道面一组自己的相位：四条环的起伏如果在同一处收，就是四条同步呼吸的圈
    const ph = [rnd()*Math.PI*2, rnd()*Math.PI*2, rnd()*Math.PI*2, rnd()*Math.PI*2];
    const amp = RING_WAVE_AMP * (0.62 + 0.55 * Math.abs(Math.sin(ph[0])));

    for (let si = 0; si < P.strands.length; si++){
      const S = P.strands[si], cnt = cts[si];
      const th = uni(0, Math.PI*2, cnt);
      const g1 = nrm(0, 1, cnt), g2 = nrm(0, 1, cnt);
      const sz = randSizes(cnt, RING_SIZE_RANGE);
      const aMid = 0.5 * (S.a[0] + S.a[1]), aHalf = 0.5 * (S.a[1] - S.a[0]);

      for (let i = 0; i < cnt; i++, w++){
        const T = th[i];
        // 毛笔的提按：最细 0.08×、最粗 1.41×，两端都不夹到零，环可以细但不能断
        const taper = Math.pow(0.5 + 0.5*Math.sin(2.1*T + ph[0]), 1.5);
        const thin  = 0.5 + 0.5*Math.sin(3.6*T + ph[1]);
        const width = RING_WIDTH * (0.18 + 1.05*taper) * (0.45 + 0.70*thin);
        const r = S.radius * (1 + 0.020*Math.sin(3.0*T + ph[2])) + g1[i]*width;
        const y = P.y0 + 0.045*Math.sin(2.0*T + ph[3]) + g2[i]*(RING_WIDTH*0.7);
        const z = r * Math.sin(T);

        sys.pos[w*3]   = r * Math.cos(T);
        sys.pos[w*3+1] = y*ct - z*st;
        sys.pos[w*3+2] = y*st + z*ct;

        // 亮暗沿弧长变，两股错开：同一段弧上一股正亮、另一股正暗
        const wave = 0.5 + 0.5*Math.sin(2.6*T + ph[0] + si*2.1);
        const m = 0.92 + 0.08 * rnd();
        sys.col[w*4]   = S.rgb[0]*m;
        sys.col[w*4+1] = S.rgb[1]*m;
        sys.col[w*4+2] = S.rgb[2]*m;
        sys.col[w*4+3] = clip01((aMid + (rnd()*0.6 - 0.3)*aHalf) *
                                (0.06 + 1.75*Math.pow(wave, 1.6)));
        sys.size[w] = sz[i];

        A[w*4] = y; A[w*4+1] = r; A[w*4+2] = T; A[w*4+3] = ct;
        B[w*4] = st; B[w*4+1] = ph[3] + Math.PI*1.7;
        B[w*4+2] = ph[2] + Math.PI*0.9; B[w*4+3] = amp;
      }
    }
  }
  fillAnim(sys);
  return {sys:sys, floatAmp:0.0, ringA:A, ringB:B};
}


/* ── 蜡烛：细圆柱，粉色带浅色竖条纹 ───────────────────────────── */
function makeCandle(){
  const n = CANDLE_COUNT, sys = makeSys(n);
  const jr = nrm(0, 0.05, n);
  for (let i = 0; i < n; i++){
    const th = rnd() * Math.PI * 2;
    const r = CANDLE_R * (1 + jr[i]);
    const y = CANDLE_POS[1] + rnd() * CANDLE_H;
    sys.pos[i*3] = CANDLE_POS[0] + r * Math.cos(th);
    sys.pos[i*3+1] = y;
    sys.pos[i*3+2] = CANDLE_POS[2] + r * Math.sin(th);
    // 绕柱身 6 道条纹，波峰附近为浅色；过渡带拉宽，底色偏白、粉只绕成条纹
    const t = clip01((Math.sin(th*6.0) - 0.05) / 0.75);
    const m = 0.85 + 0.15 * rnd();
    for (let c = 0; c < 3; c++)
      sys.col[i*4+c] = (CANDLE_COLOR[c]*(1-t) + CANDLE_STRIPE[c]*t) * m;
    sys.col[i*4+3] = CANDLE_ALPHA[0] + (CANDLE_ALPHA[1]-CANDLE_ALPHA[0]) * rnd();
    sys.size[i] = CANDLE_POINT_SIZE;
  }
  fillAnim(sys);
  return {sys:sys, floatAmp:0.0};
}


/* ── 背景星星：半径 8~15 的球壳，带闪烁 ─────────────────────────── */
function makeStars(){
  const n = STAR_COUNT, sys = makeSys(n);
  for (let i = 0; i < n; i++){
    const u = rnd()*2 - 1, th = rnd()*Math.PI*2;
    const rxy = Math.sqrt(Math.max(0, 1 - u*u));
    const rad = STAR_RADIUS[0] + (STAR_RADIUS[1]-STAR_RADIUS[0]) * rnd();
    sys.pos[i*3]   = rxy * Math.cos(th) * rad;
    sys.pos[i*3+1] = u * rad;
    sys.pos[i*3+2] = rxy * Math.sin(th) * rad;
    const t = rnd();                              // 白 → 淡蓝
    sys.col[i*4]   = 1.0 * (1-t) + 0.72 * t;
    sys.col[i*4+1] = 1.0 * (1-t) + 0.85 * t;
    sys.col[i*4+2] = 1.0 * (1-t) + 1.00 * t;
    sys.col[i*4+3] = STAR_ALPHA[0] + (STAR_ALPHA[1]-STAR_ALPHA[0]) * rnd();
    sys.size[i] = Math.round(STAR_SIZE_RANGE[0] +
                  (STAR_SIZE_RANGE[1]-STAR_SIZE_RANGE[0]) * rnd());
  }
  fillAnim(sys, STAR_TWINKLE);
  return {sys:sys, floatAmp:0.0, twinkle:true};
}


/* ── 星云雾：少量大尺寸 + 极低透明度，把背景垫起来一点 ─────────── */
function makeNebula(maxPointSize){
  const n = NEBULA_COUNT, sys = makeSys(n);
  const lim = Math.max(4, Math.min(maxPointSize, 50));
  for (let i = 0; i < n; i++){
    const u = rnd()*2 - 1, th = rnd()*Math.PI*2;
    const rxy = Math.sqrt(Math.max(0, 1 - u*u));
    const rad = NEBULA_RADIUS[0] + (NEBULA_RADIUS[1]-NEBULA_RADIUS[0]) * rnd();
    sys.pos[i*3]   = rxy * Math.cos(th) * rad;
    sys.pos[i*3+1] = u * 0.7 * rad;
    sys.pos[i*3+2] = rxy * Math.sin(th) * rad;
    const c = NEBULA_COLORS[Math.floor(rnd() * NEBULA_COLORS.length)];
    const m = 0.7 + 0.3 * rnd();
    sys.col[i*4] = c[0]*m; sys.col[i*4+1] = c[1]*m; sys.col[i*4+2] = c[2]*m;
    sys.col[i*4+3] = NEBULA_ALPHA[0] + (NEBULA_ALPHA[1]-NEBULA_ALPHA[0]) * rnd();
    sys.size[i] = Math.min(Math.round(NEBULA_SIZE_RANGE[0] +
                  (NEBULA_SIZE_RANGE[1]-NEBULA_SIZE_RANGE[0]) * rnd()), lim);
  }
  fillAnim(sys);
  return {sys:sys, floatAmp:0.0};
}


/* ── 彩色纸屑：大小拉得很开，才有一虚一实的疏密 ────────────────── */
function makeConfetti(){
  const n = CONFETTI_COUNT, sys = makeSys(n);
  const nSpray = Math.floor(n * CONFETTI_SPRAY_RATIO);
  for (let i = 0; i < n; i++){
    let x, y, z;
    if (i < nSpray){                              // 左上角那一簇，向中心聚
      const u = rnd()*2 - 1, th = rnd()*Math.PI*2;
      const rxy = Math.sqrt(Math.max(0, 1 - u*u));
      const rad = CONFETTI_SPRAY_R * Math.pow(rnd(), 0.6);
      x = rxy*Math.cos(th)*rad + CONFETTI_SPRAY[0];
      y = u*rad + CONFETTI_SPRAY[1];
      z = rxy*Math.sin(th)*rad + CONFETTI_SPRAY[2];
    } else {                                      // 其余绕着蛋糕铺一圈椭球壳
      const u = rnd()*2 - 1, th = rnd()*Math.PI*2;
      const rxy = Math.sqrt(Math.max(0, 1 - u*u));
      const rad = 1.3 + (3.4 - 1.3) * rnd();
      x = rxy*Math.cos(th)*rad; y = u*1.05*rad; z = rxy*Math.sin(th)*rad;
    }
    sys.pos[i*3] = x; sys.pos[i*3+1] = y; sys.pos[i*3+2] = z;
    const c = CONFETTI_COLORS[Math.floor(rnd() * CONFETTI_COLORS.length)];
    const m = 0.85 + 0.15 * rnd();
    sys.col[i*4] = c[0]*m; sys.col[i*4+1] = c[1]*m; sys.col[i*4+2] = c[2]*m;
    sys.col[i*4+3] = CONFETTI_ALPHA[0] + (CONFETTI_ALPHA[1]-CONFETTI_ALPHA[0]) * rnd();
  }
  sys.size.set(randSizes(n, CONFETTI_SIZE_RANGE));
  fillAnim(sys);
  return {sys:sys, floatAmp:FLOAT_AMP * 1.6};   // 纸屑飘得比蛋糕明显一点
}


/* ── 四角星闪光：金色，用星形贴图成形，一闪一闪 ─────────────────── */
function makeSparks(){
  const n = SPARK_COUNT, sys = makeSys(n);
  for (let i = 0; i < n; i++){
    const u = rnd()*2 - 1, th = rnd()*Math.PI*2;
    const rxy = Math.sqrt(Math.max(0, 1 - u*u));
    const rad = 1.3 + (2.7 - 1.3) * rnd();     // 收到 2.7 以内，撒远了就落在画面外
    sys.pos[i*3]   = rxy * Math.cos(th) * rad;
    sys.pos[i*3+1] = u * 0.8 * rad;
    sys.pos[i*3+2] = rxy * Math.sin(th) * rad;
    const m = 0.85 + 0.15 * rnd();
    sys.col[i*4] = SPARK_COLOR[0]*m; sys.col[i*4+1] = SPARK_COLOR[1]*m;
    sys.col[i*4+2] = SPARK_COLOR[2]*m;
    sys.col[i*4+3] = SPARK_ALPHA[0] + (SPARK_ALPHA[1]-SPARK_ALPHA[0]) * rnd();
  }
  sys.size.set(randSizes(n, SPARK_SIZE_RANGE));
  fillAnim(sys, [0.8, 2.0]);
  return {sys:sys, floatAmp:FLOAT_AMP * 2.0, twinkle:true};
}


/* ── 火焰：上尖下宽的水滴形，life 循环实现飘散 → 消失 → 重生 ───── */
const flame = {
  life: null, theta: null, rad: null, rate: null, phase: null,
  baseRGB: new Float32Array(FLAME_COUNT * 3),
  pos: new Float32Array(FLAME_COUNT * 3),
  col: new Float32Array(FLAME_COUNT * 4),
  size: null,
};
function makeFlame(){
  const n = FLAME_COUNT;
  flame.life  = new Float32Array(n);
  flame.theta = new Float32Array(n);
  flame.rad   = new Float32Array(n);
  flame.rate  = new Float32Array(n);
  flame.phase = new Float32Array(n);
  for (let i = 0; i < n; i++){
    const l = rnd();
    flame.life[i]  = l;
    flame.theta[i] = rnd() * Math.PI * 2;
    flame.rad[i]   = Math.sqrt(rnd());
    flame.rate[i]  = FLAME_RISE[0] + (FLAME_RISE[1]-FLAME_RISE[0]) * rnd();
    flame.phase[i] = rnd() * Math.PI * 2;
    // 按 life 预算好颜色：底部亮黄 → 中部橙 → 顶部红
    for (let c = 0; c < 3; c++){
      flame.baseRGB[i*3+c] = l < 0.5
        ? FLAME_COL_BOTTOM[c] + (FLAME_COL_MID[c]-FLAME_COL_BOTTOM[c]) * (l/0.5)
        : FLAME_COL_MID[c] + (FLAME_COL_TOP[c]-FLAME_COL_MID[c]) * ((l-0.5)/0.5);
      flame.col[i*4+c] = flame.baseRGB[i*3+c];
    }
  }
  flame.size = randSizes(n, FLAME_SIZE_RANGE);
}

function updateFlame(t, dt){
  const n = flame.n || FLAME_COUNT;
  const life = flame.life, th = flame.theta, rad = flame.rad,
        rate = flame.rate, ph = flame.phase, pos = flame.pos, col = flame.col;
  const [fx, fy, fz] = FLAME_POS;
  for (let i = 0; i < n; i++){
    let l = life[i] + rate[i] * dt;
    l -= Math.floor(l);                       // 到顶就回到底部重新生成
    life[i] = l;
    // 水滴形：贴着烛芯的底部先收一下，往上鼓起来，再一路收窄聚成尖
    const bulge = 0.55 + 0.45 * Math.min(1, l / 0.15);
    const r = FLAME_BASE_R * rad[i] * Math.pow(1 - l, FLAME_TAPER) * bulge
            + FLAME_DRIFT * l * l;
    const ang = th[i] + t * FLAME_SWIRL + l * 2.0;
    pos[i*3]   = fx + Math.cos(ang)*r + FLAME_JITTER*Math.sin(t*17.0 + ph[i]);
    pos[i*3+1] = fy + l * FLAME_HEIGHT;
    pos[i*3+2] = fz + Math.sin(ang)*r + FLAME_JITTER*Math.cos(t*19.0 + ph[i]);
    // 底部快速点亮，越往上越淡直至消失；每帧重取一次随机做闪烁
    const fadeIn  = clip01(l / 0.10);
    const fadeOut = 1 - Math.pow(clip01((l - 0.45) / 0.55), 1.6);
    col[i*4+3] = clip01(fadeIn * fadeOut *
                        (FLAME_ALPHA[0] + (FLAME_ALPHA[1]-FLAME_ALPHA[0]) * Math.random()));
  }
}
flame.n = FLAME_COUNT;


/* ══════════════════════════════════════════════════════════════════════════
   ④ 点精灵贴图 —— 程序算出来的，没有任何外部图片
   ══════════════════════════════════════════════════════════════════════════ */

function makeGlowTexture(){
  const S = GLOW_TEX_SIZE, c = (S - 1) * 0.5, d = new Uint8Array(S * S * 4);
  for (let y = 0; y < S; y++){
    for (let x = 0; x < S; x++){
      const r = Math.min(1, Math.hypot(x - c, y - c) / c);
      // 渐变必须铺满整个贴图半径，只在外圈留一点渐变的话，缩小采样就被跳过了
      const halo = Math.pow(clip01(1 - r*r), GLOW_HALO);
      const core = Math.pow(clip01((GLOW_CORE - r) / GLOW_CORE), 0.85);
      const a = clip01(halo * 0.80 + core * 0.45);
      const i = (y * S + x) * 4;
      d[i] = d[i+1] = d[i+2] = 255;           // 白色，靠顶点色染
      d[i+3] = Math.round(a * 255);
    }
  }
  return d;
}

function makeStarTexture(){
  const S = STAR_TEX_SIZE, c = (S - 1) * 0.5, d = new Uint8Array(S * S * 4);
  for (let y = 0; y < S; y++){
    for (let x = 0; x < S; x++){
      const dx = (x - c) / c, dy = (y - c) / c;
      const r = Math.hypot(dx, dy);
      const core = clip01(1 - r / STAR_TEX_CORE);
      // 横截面的 0.6 次方把线性衰减「撑方」，星芒才不会被缩小采样吃掉
      const armH = Math.pow(clip01(1 - Math.abs(dy)/STAR_TEX_ARM), 0.6) *
                   Math.pow(clip01(1 - Math.abs(dx)), STAR_TEX_FALLOFF);
      const armV = Math.pow(clip01(1 - Math.abs(dx)/STAR_TEX_ARM), 0.6) *
                   Math.pow(clip01(1 - Math.abs(dy)), STAR_TEX_FALLOFF);
      const a = clip01(Math.max(core, armH, armV));
      const i = (y * S + x) * 4;
      d[i] = d[i+1] = d[i+2] = 255;
      d[i+3] = Math.round(a * 255);
    }
  }
  return d;
}


/* ══════════════════════════════════════════════════════════════════════════
   ⑤ 着色器
   ══════════════════════════════════════════════════════════════════════════ */

// 发光的小点 / 实体面 共用：实体用 uUseMap=0，方点铺满自己的方块
// uPremul 是实体面专用的：原程序对 solid 组做的是 col.rgb *= col.a，
// 再配 glBlendFunc(GL_ONE, GL_ZERO) 覆盖式写入。少了这一步，
// 蛋糕会亮 1/0.73 ≈ 37%，直接冲过 bloom 阈值，整块柱身自己发起光来。
const POINT_VS = `
attribute vec4 aColor;
attribute float aSize;
attribute vec4 aAnim;
uniform float uDpr, uTime, uFloatAmp, uTwinkle, uPremul;
varying vec4 vColor;
void main(){
  vec3 p = position;
  p.y += uFloatAmp * sin(uTime * aAnim.y + aAnim.x);
  gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
  gl_PointSize = aSize * uDpr;
  float a = aColor.a;
  if (uTwinkle > 0.5) a *= 0.55 + 0.45 * sin(uTime * aAnim.z + aAnim.w);
  // 闪烁只改 alpha，所以先算 rgb 再算 a，两者互不干扰
  vColor = vec4(aColor.rgb * mix(1.0, aColor.a, uPremul), a);
}`;

const POINT_FS = `
uniform sampler2D uMap;
uniform float uUseMap;
varying vec4 vColor;
void main(){
  vec4 c = vColor;
  if (uUseMap > 0.5) c *= texture2D(uMap, gl_PointCoord);
  gl_FragColor = c;
}`;

// 光环：每帧在顶点着色器里重算几何，两条行波
const RING_VS = `
attribute vec4 aColor;
attribute float aSize;
attribute vec4 aRingA;     // y0, r, theta, ct
attribute vec4 aRingB;     // st, ph_v, ph_r, amp
uniform float uDpr, uTime, uWaveSpeed, uBreath, uBreathSpeed;
varying vec4 vColor;
void main(){
  float th = aRingA.z;
  float yy = aRingA.x + aRingB.w * sin(2.0*th - uWaveSpeed*uTime + aRingB.y);
  float rr = aRingA.y * (1.0 + uBreath * sin(3.0*th + uBreathSpeed*uTime + aRingB.z));
  float zz = rr * sin(th);
  vec3 p = vec3(rr*cos(th), yy*aRingA.w - zz*aRingB.x, yy*aRingB.x + zz*aRingA.w);
  gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
  gl_PointSize = aSize * uDpr;
  vColor = aColor;
}`;

const QUAD_VS = `
varying vec2 vUv;
void main(){
  vUv = uv;
  gl_Position = vec4(position.xy, 0.0, 1.0);
}`;

const BRIGHT_FS = `
uniform sampler2D uScene;
uniform float uGain, uThreshold;
varying vec2 vUv;
void main(){
  // 先乘增益再减阈值，结果夹到 0 —— 只有真正亮的东西该过阈值
  gl_FragColor = vec4(clamp(texture2D(uScene, vUv).rgb * uGain - uThreshold, 0.0, 1.0), 1.0);
}`;

const COMPOSITE_FS = `
uniform sampler2D uScene, uNear, uFar;
uniform vec3 uW;
varying vec2 vUv;
void main(){
  // 合成是加法不是插值，所以原图权重接近 1，辉光是叠上去的
  vec3 c = texture2D(uScene, vUv).rgb * uW.x;
  c += texture2D(uNear, vUv).rgb * uW.y;
  c += texture2D(uFar,  vUv).rgb * uW.z;
  gl_FragColor = vec4(c, 1.0);
}`;

// 可分离高斯：把权重直接烘进源码，省掉 uniform 数组和循环
function blurFragment(weights, half){
  let s = `uniform sampler2D uSrc;\nuniform vec2 uStep;\nvarying vec2 vUv;\nvoid main(){\n` +
          `  vec4 acc = texture2D(uSrc, vUv) * ${weights[half].toFixed(7)};\n`;
  for (let i = 0; i < weights.length; i++){
    if (i === half) continue;
    s += `  acc += texture2D(uSrc, vUv + uStep * ${(i - half).toFixed(1)}) * ${weights[i].toFixed(7)};\n`;
  }
  return s + `  gl_FragColor = vec4(acc.rgb, 1.0);\n}`;
}


/* ══════════════════════════════════════════════════════════════════════════
   ⑥ 建场
   ══════════════════════════════════════════════════════════════════════════ */

let renderer, scene, camera, quadScene, quadCam, quadMesh, quadMat = {};
let rtScene, rtBright, rtBlurA, rtBlurB, rtFarA, rtFarB;
let glowTex, starTex;
let groups = [];
let dpr = 1, bloomW = 1, bloomH = 1;

function isWebGLAvailable(){
  try {
    const c = document.createElement('canvas');
    return !!(window.WebGLRenderingContext &&
              (c.getContext('webgl2') || c.getContext('webgl')));
  } catch(e){ return false; }
}

function makeTex(data, size, mipmap){
  const t = new THREE.DataTexture(data, size, size, THREE.RGBAFormat, THREE.UnsignedByteType);
  t.magFilter = THREE.LinearFilter;
  t.wrapS = t.wrapT = THREE.ClampToEdgeWrapping;
  t.generateMipmaps = mipmap;
  // 星芒是细特征，mipmap 的本质就是缩小时把邻域平均掉，平均掉的正是那两条芒
  t.minFilter = mipmap ? THREE.LinearMipmapLinearFilter : THREE.LinearFilter;
  t.needsUpdate = true;
  return t;
}

function makeTarget(w, h, withDepth){
  return new THREE.WebGLRenderTarget(Math.max(1, w|0), Math.max(1, h|0), {
    minFilter: THREE.LinearFilter,
    magFilter: THREE.LinearFilter,
    format: THREE.RGBAFormat,
    type: THREE.UnsignedByteType,
    depthBuffer: !!withDepth,
    stencilBuffer: false,
    wrapS: THREE.ClampToEdgeWrapping,
    wrapT: THREE.ClampToEdgeWrapping,
  });
}

function buildPointMaterial(useMap, twinkle, floatAmp, tex, premul){
  const m = new THREE.ShaderMaterial({
    vertexShader: POINT_VS,
    fragmentShader: POINT_FS,
    uniforms: {
      uDpr:      {value: dpr},
      uTime:     {value: 0},
      uFloatAmp: {value: floatAmp},
      uTwinkle:  {value: twinkle ? 1 : 0},
      uPremul:   {value: premul ? 1 : 0},
      uUseMap:   {value: useMap ? 1 : 0},
      uMap:      {value: tex || null},
    },
    // 实体面：GL_ONE/GL_ZERO 就是「源色直接覆盖」= three 的 NoBlending
    transparent: !!useMap,
    depthTest: true,
    depthWrite: !useMap,
    depthFunc: THREE.LessDepth,          // 必须是 LESS：等深的后到者要被挡掉
    blending: useMap ? THREE.AdditiveBlending : THREE.NoBlending,
  });
  return m;
}

function buildPoints(sys, opts){
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(sys.pos, 3));
  g.setAttribute('aColor',   new THREE.BufferAttribute(sys.col, 4));
  g.setAttribute('aSize',    new THREE.BufferAttribute(sys.size, 1));
  g.setAttribute('aAnim',    new THREE.BufferAttribute(sys.anim, 4));
  if (opts.ringA){
    g.setAttribute('aRingA', new THREE.BufferAttribute(opts.ringA, 4));
    g.setAttribute('aRingB', new THREE.BufferAttribute(opts.ringB, 4));
  }
  const pts = new THREE.Points(g, opts.material);
  pts.frustumCulled = false;             // 点没有体积包围盒，且环的几何在动
  pts.renderOrder = opts.renderOrder;
  return pts;
}

function build(){
  // —— 点精灵贴图 ——
  glowTex = makeTex(makeGlowTexture(), GLOW_TEX_SIZE, true);
  starTex = makeTex(makeStarTexture(), STAR_TEX_SIZE, false);

  const gl = renderer.getContext();
  const maxPt = gl.getParameter(gl.ALIASED_POINT_SIZE_RANGE)[1] || 32;

  // —— 生成粒子 ——
  const cake   = makeCake();
  const plate  = makePlate();
  const ring   = makeRing();
  const candle = makeCandle();
  const stars  = makeStars();
  const nebula = makeNebula(maxPt);
  const conf   = makeConfetti();
  const sparks = makeSparks();
  makeFlame();
  updateFlame(0, 0);

  // —— 实体面：不贴图、方点铺满方块、alpha 预乘、覆盖式写、写深度 ——
  const mkSolid = (amp) => buildPointMaterial(false, false, amp, null, true);
  // —— 发光物：柔光球贴图 + 加法混合，接受深度测试但不写深度 ——
  const mkGlow = (tw, amp, tex) => buildPointMaterial(true, tw, amp, tex, false);

  const matCake   = mkSolid(cake.floatAmp);
  const matPlate  = mkSolid(0);
  const matCandle = mkSolid(0);
  const matNeb    = mkGlow(false, 0, glowTex);
  const matStar   = mkGlow(true, 0, glowTex);
  const matConf   = mkGlow(false, conf.floatAmp, glowTex);
  const matSpark  = mkGlow(true, sparks.floatAmp, starTex);
  const matFlame  = mkGlow(false, 0, glowTex);
  matFlame.depthTest = false;            // 火焰是一团体积，写深度会被自己掏成空壳

  const matRing = new THREE.ShaderMaterial({
    vertexShader: RING_VS,
    fragmentShader: POINT_FS,
    uniforms: {
      uDpr:         {value: dpr},
      uTime:        {value: 0},
      uWaveSpeed:   {value: RING_WAVE_SPEED},
      uBreath:      {value: RING_BREATH},
      uBreathSpeed: {value: RING_BREATH_SPEED},
      uUseMap:      {value: 1},
      uMap:         {value: glowTex},
    },
    transparent: true,
    depthTest: true,
    depthWrite: false,
    depthFunc: THREE.LessDepth,
    blending: THREE.AdditiveBlending,
  });

  // —— 场景树 ——
  // 蛋糕 / 盘子 / 蜡烛 / 氛围粒子：一起绕 Y 轴自转。
  // 氛围粒子必须挂在这一组里 —— 画在外面的话，蛋糕在转、背景纹丝不动，
  // 看起来就是「蛋糕在一块静止的幕布前面转」，空间关系当场塌掉。
  const spinning = new THREE.Group();
  const ringGroup = new THREE.Group();
  const flameGroup = new THREE.Group();

  const add = (sys, opt) => {
    const p = buildPoints(sys, opt);
    (opt.parent || spinning).add(p);
    groups.push({obj: p, material: opt.material, kind: opt.kind});
    return p;
  };

  add(cake.sys,   {material: matCake,   renderOrder: 0, kind: 'cake'});
  add(plate.sys,  {material: matPlate,  renderOrder: 1, kind: 'plate'});
  add(candle.sys, {material: matCandle, renderOrder: 2, kind: 'candle'});
  add(nebula.sys, {material: matNeb,    renderOrder: 3, kind: 'static'});
  add(stars.sys,  {material: matStar,   renderOrder: 4, kind: 'static'});
  add(conf.sys,   {material: matConf,   renderOrder: 5, kind: 'static'});
  add(sparks.sys, {material: matSpark,  renderOrder: 6, kind: 'static'});

  const ringPts = buildPoints(ring.sys, {
    material: matRing, renderOrder: 7, ringA: ring.ringA, ringB: ring.ringB});
  ringGroup.add(ringPts);

  // 火焰：不参与深度，永远压在最上面
  const fg = new THREE.BufferGeometry();
  fg.setAttribute('position', new THREE.BufferAttribute(flame.pos, 3).setUsage(THREE.DynamicDrawUsage));
  fg.setAttribute('aColor',   new THREE.BufferAttribute(flame.col, 4).setUsage(THREE.DynamicDrawUsage));
  fg.setAttribute('aSize',    new THREE.BufferAttribute(flame.size, 1));
  fg.setAttribute('aAnim',    new THREE.BufferAttribute(new Float32Array(FLAME_COUNT*4), 4));
  const flamePts = new THREE.Points(fg, matFlame);
  flamePts.frustumCulled = false;
  flamePts.renderOrder = 8;
  flameGroup.add(flamePts);

  const flameRef = {geo: fg, obj: flamePts};

  scene.add(spinning); scene.add(ringGroup); scene.add(flameGroup);

  return {
    spinning: spinning, ringGroup: ringGroup, flameGroup: flameGroup,
    flameRef: flameRef,
    mats: [matCake, matPlate, matCandle, matNeb, matStar, matConf,
           matSpark, matFlame, matRing],
  };
}


/* ══════════════════════════════════════════════════════════════════════════
   ⑦ 辉光后处理 —— 亮度提取 → 近层全分辨率模糊 → 远层半分辨率模糊 → 合成
   ══════════════════════════════════════════════════════════════════════════ */

let blurNearH, blurNearV, blurFarH, blurFarV;

function buildPost(){
  const geo = new THREE.PlaneGeometry(2, 2);

  quadMat.bright = new THREE.ShaderMaterial({
    vertexShader: QUAD_VS, fragmentShader: BRIGHT_FS,
    uniforms: {uScene:{value:null}, uGain:{value:BLOOM_GAIN}, uThreshold:{value:BLOOM_THRESHOLD}},
    depthTest: false, depthWrite: false, blending: THREE.NoBlending,
  });

  const wn = gaussianWeights(BLOOM_SIGMA_NEAR, 3.0);
  const wf = gaussianWeights(BLOOM_SIGMA_FAR, 3.0);
  const mkBlur = (weights, half) => new THREE.ShaderMaterial({
    vertexShader: QUAD_VS, fragmentShader: blurFragment(weights.w, half),
    uniforms: {uSrc:{value:null}, uStep:{value:new THREE.Vector2()}},
    depthTest: false, depthWrite: false, blending: THREE.NoBlending,
  });
  blurNearH = mkBlur(wn, wn.half); blurNearV = mkBlur(wn, wn.half);
  blurFarH  = mkBlur(wf, wf.half); blurFarV  = mkBlur(wf, wf.half);

  quadMat.copy = new THREE.ShaderMaterial({
    vertexShader: QUAD_VS,
    fragmentShader: `uniform sampler2D uSrc;varying vec2 vUv;
      void main(){ gl_FragColor = texture2D(uSrc, vUv); }`,
    uniforms: {uSrc:{value:null}},
    depthTest: false, depthWrite: false, blending: THREE.NoBlending,
  });

  quadMat.composite = new THREE.ShaderMaterial({
    vertexShader: QUAD_VS, fragmentShader: COMPOSITE_FS,
    uniforms: {
      uScene:{value:null}, uNear:{value:null}, uFar:{value:null},
      uW:{value:new THREE.Vector3(BLOOM_W_ORIGINAL, BLOOM_W_NEAR, BLOOM_W_FAR)},
    },
    depthTest: false, depthWrite: false, blending: THREE.NoBlending,
  });

  quadScene = new THREE.Scene();
  quadCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
  quadMesh = new THREE.Mesh(geo, quadMat.copy);
  quadMesh.frustumCulled = false;
  quadScene.add(quadMesh);
}

function pass(mat, target, clear){
  quadMesh.material = mat;
  renderer.setRenderTarget(target);
  if (clear){
    renderer.setClearColor(0x000000, 0);
    renderer.clear(true, false, false);
  }
  renderer.render(quadScene, quadCam);
}

function allocateTargets(){
  [rtScene, rtBright, rtBlurA, rtBlurB, rtFarA, rtFarB].forEach(rt => rt && rt.dispose());

  const bw = bloomW = Math.max(1, Math.round(cssW));    // 辉光按 CSS 像素算：
  const bh = bloomH = Math.max(1, Math.round(cssH));    // sigma 的像素含义不随屏变

  rtScene = makeTarget(devW(), devH(), true);           // 场景必须挂深度附件
  rtBright = makeTarget(bw, bh, false);
  rtBlurA  = makeTarget(bw, bh, false);
  rtBlurB  = makeTarget(bw, bh, false);
  rtFarA   = makeTarget(bw >> 1, bh >> 1, false);       // 远层半分辨率
  rtFarB   = makeTarget(bw >> 1, bh >> 1, false);

  camera.aspect = cssW / cssH;
  camera.updateProjectionMatrix();
  renderer.setRenderTarget(null);
}

function runBloom(){
  const g = renderer.getContext();

  // 1) 亮度提取
  quadMat.bright.uniforms.uScene.value = rtScene.texture;
  pass(quadMat.bright, rtBright, true);

  // 2) 近层：全分辨率，先横后纵
  blurNearH.uniforms.uSrc.value = rtBright.texture;
  blurNearH.uniforms.uStep.value.set(1 / bloomW, 0);
  pass(blurNearH, rtBlurA, true);

  blurNearV.uniforms.uSrc.value = rtBlurA.texture;
  blurNearV.uniforms.uStep.value.set(0, 1 / bloomH);
  pass(blurNearV, rtBlurB, true);

  // 3) 远层：降到半分辨率再模糊，等效半径翻倍而开销降到 1/4
  quadMat.copy.uniforms.uSrc.value = rtBright.texture;
  pass(quadMat.copy, rtFarA, true);

  blurFarH.uniforms.uSrc.value = rtFarA.texture;
  blurFarH.uniforms.uStep.value.set(1 / Math.max(1, bloomW >> 1), 0);
  pass(blurFarH, rtFarB, true);

  blurFarV.uniforms.uSrc.value = rtFarB.texture;
  blurFarV.uniforms.uStep.value.set(0, 1 / Math.max(1, bloomH >> 1));
  pass(blurFarV, rtFarA, true);

  // 4) 加权合成到屏幕：原图 ×0.94 + 近层 ×0.33 + 远层 ×0.18
  quadMat.composite.uniforms.uScene.value = rtScene.texture;
  quadMat.composite.uniforms.uNear.value  = rtBlurB.texture;
  quadMat.composite.uniforms.uFar.value   = rtFarA.texture;
  pass(quadMat.composite, null, true);
  void g;
}


/* ══════════════════════════════════════════════════════════════════════════
   ⑧ 交互与主循环
   ══════════════════════════════════════════════════════════════════════════ */

let cssW = WIN_W, cssH = WIN_H;
let baseDist = CAM_DIST_START;
let yaw = 0, pitch = CAM_PITCH_START, zoom = 1;
let angle = 0, ringAngle = 0;
let started = 0, lastMs = 0;
let reduceMotion = false;
let dirty = true;
let built = null;

function computeBaseDist(){
  const tanHalf = Math.tan(FOV * Math.PI / 360);
  const aspect = Math.max(0.05, cssW / cssH);
  // 窄屏时把相机往后拉，保证环和盘子横向画得下
  return Math.max(CAM_DIST_START, CAM_FIT_HALF_W / (tanHalf * aspect));
}

// 设备像素尺寸。渲染器内部一切按它算，DPR 只在 gl_PointSize 那一处出现
const devW = () => Math.max(1, Math.round(cssW * dpr));
const devH = () => Math.max(1, Math.round(cssH * dpr));

function updateCamera(){
  const d = baseDist * zoom;
  const p = pitch * Math.PI / 180, y = yaw * Math.PI / 180;
  camera.position.set(-Math.cos(p) * Math.sin(y) * d,
                       Math.sin(p) * d,
                       Math.cos(p) * Math.cos(y) * d);
  camera.up.set(0, 1, 0);
  camera.lookAt(0, 0, 0);
}

/* ── 问候语 ─────────────────────────────────────────────────────
   原程序在 bloom 合成**之后**才画字（bloom 结束时顺带把深度测试关了），
   所以字本身不过 bloom —— 那圈蓝辉光是烘在贴图里的。build_text_surface()
   的步骤是：

     ① 描边色 (90,130,220) 在 (-2,0) (2,0) (0,-2) (0,2) 四个偏移上各画一遍，
        全部 BLEND_RGBA_ADD —— 加法，不是覆盖；
     ② 把叠好的整张图缩到 1/8 再放大回来（两次 smoothscale ≈ 一次模糊），
        仍然加法叠上去 —— 这是外面那圈很宽很淡的蓝雾；
     ③ 最后才把实心字 (235,240,255) 用普通 alpha 混合盖在最上层。

   贴到屏幕用的是 SRC_ALPHA / ONE_MINUS_SRC_ALPHA，也就是普通覆盖，
   所以这里拿一张 canvas 按同样的步骤画，再用默认混合盖上去，结果一致。

   为什么不能用 text-shadow：text-shadow 是 alpha 混合，多叠几层只会让颜色
   往描边色收敛，永远到不了白；参考图文字区峰值是纯 255，只能靠加法叠出来。 */
const GREET_TEXT     = 'Happy Birthday';   // TEXT_MAIN
const GREET_SIZE     = 64;                 // TEXT_MAIN_SIZE
const GREET_MARGIN   = 42;                 // TEXT_MARGIN_BOTTOM
const GREET_CORE_RGB = [235, 240, 255];    // TEXT_COLOR
const GREET_GLOW_RGB = [ 90, 130, 220];    // TEXT_GLOW_RGB
// 字体既不能用页面的 Figtree，也不能想当然用 Arial —— 原程序是
//     pygame.font.SysFont("arial,segoeui,helvetica,dejavusans", 64, bold=True)
// 而 pygame 的 match_font("arial") 在这台机器上给的是 ARIALN.TTF，
// 也就是 **Arial Narrow**，不是 Arial：
//     match_font('arial') -> C:\Windows\Fonts\ARIALN.TTF
//     render('Happy Birthday') -> 387 x 74
// 参考图里量到的字宽正好是 389，对得上。用普通 Arial Bold 是 473 宽，
// 宽出两成，字一胖辉光就糊成一片，跟参考图差得很明显。
// 回退链一律按"窄体"排，绝不退到普通 Arial —— 那样字宽会多出两成：
// Linux 有 Liberation Sans Narrow，其余平台用 Google Fonts 上的
// Roboto Condensed（字宽约为普通 Arial 的 0.82，和 Arial Narrow 基本一致）。
const GREET_WEIGHT   = 700;
const GREET_FAMILY   = '"Arial Narrow", "Liberation Sans Narrow", "Roboto Condensed", "Helvetica Neue", Arial, sans-serif';

// size 是 CSS 像素。位图按 size * s 画（s = 设备像素比），和 WebGL 那边
// 场景按设备像素渲染是一套口径 —— 否则 dpr=2 的手机上，整个画面是清晰的，
// 唯独正中间的问候语是糊的。s = 1 时下面每个数字都回到原程序的绝对值。
function buildGreet(size, s){
  const px = size * s;
  const pad = Math.round(Math.max(8, Math.floor(size / 3)) * s);   // max(8, size//3)
  const font = GREET_WEIGHT + ' ' + px + 'px ' + GREET_FAMILY;

  // 先量字：用 fontBoundingBox*（字体自身的 ascent/descent，和 pygame 的
  // font.render 高度是同一套 metrics），拿不到才退回字形包围盒。
  const probe = document.createElement('canvas').getContext('2d');
  probe.font = font;
  const m = probe.measureText(GREET_TEXT);
  const tw = Math.ceil(m.width);
  const asc  = Math.ceil(m.fontBoundingBoxAscent  || m.actualBoundingBoxAscent  || px * 0.90);
  const desc = Math.ceil(m.fontBoundingBoxDescent || m.actualBoundingBoxDescent || px * 0.25);

  const W = tw + pad * 2, H = asc + desc + pad * 2;
  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const g = cv.getContext('2d');
  g.font = font;
  g.textBaseline = 'alphabetic';
  const bx = pad, by = pad + asc;                  // 基线

  // ① 四个方向的加法描边（原程序是四个 ±2px 的偏移）
  const d = Math.max(1, Math.round(2 * s));
  g.globalCompositeOperation = 'lighter';
  g.fillStyle = 'rgb(' + GREET_GLOW_RGB.join(',') + ')';
  const off = [[-d, 0], [d, 0], [0, -d], [0, d]];
  for (let i = 0; i < off.length; i++) g.fillText(GREET_TEXT, bx + off[i][0], by + off[i][1]);

  // ② 缩到 1/8 再放大回来，加法叠加 —— 外面那圈宽而淡的雾
  const sw = Math.max(1, W >> 3), sh = Math.max(1, H >> 3);
  const small = document.createElement('canvas');
  small.width = sw; small.height = sh;
  const sg = small.getContext('2d');
  sg.imageSmoothingEnabled = true;
  if ('imageSmoothingQuality' in sg) sg.imageSmoothingQuality = 'high';
  sg.drawImage(cv, 0, 0, sw, sh);
  g.imageSmoothingEnabled = true;
  if ('imageSmoothingQuality' in g) g.imageSmoothingQuality = 'high';
  g.drawImage(small, 0, 0, sw, sh, 0, 0, W, H);

  // ③ 实心字盖在最上层，普通 alpha 混合
  g.globalCompositeOperation = 'source-over';
  g.fillStyle = 'rgb(' + GREET_CORE_RGB.join(',') + ')';
  g.fillText(GREET_TEXT, bx, by);

  return cv;   // 位图尺寸 = CSS 尺寸 * s
}

function fitText(){
  const el = document.getElementById('greet');
  if (!el) return;

  // 原程序是固定 1000x800 的窗口，字号 64、距底 42 都是绝对像素。
  // 屏幕比这组基准小就整体按比例缩。再乘一个相机因子：窄屏上相机会后退
  // 让整个蛋糕进画面，字也跟着缩，比例关系不变。1000x800 上两个因子都是 1，
  // 于是字号正好 64、距底正好 42 —— 和参考图逐像素对齐。
  const k = Math.min(cssW / WIN_W, cssH / WIN_H, 1) * (CAM_DIST_START / baseDist);
  const size = Math.max(18, Math.round(GREET_SIZE * k));
  const s = Math.max(1, dpr);

  const src = buildGreet(size, s);
  const cw = src.width / s, ch = src.height / s;    // CSS 尺寸

  if (el.width !== src.width || el.height !== src.height){
    el.width = src.width; el.height = src.height;
  }
  const g = el.getContext('2d');
  g.clearRect(0, 0, el.width, el.height);
  g.drawImage(src, 0, 0);
  el.style.width  = cw + 'px';
  el.style.height = ch + 'px';

  // 再按宽度收一次，保证窄屏上不出界（整张等比缩，不重画）
  const maxW = cssW * 0.88;
  if (cw > maxW){
    el.style.width  = maxW + 'px';
    el.style.height = (ch * maxW / cw) + 'px';
  }
  el.style.setProperty('--greet-bottom', Math.max(10, GREET_MARGIN * k) + 'px');
}

function onResize(){
  cssW = Math.max(1, window.innerWidth);
  cssH = Math.max(1, window.innerHeight);
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  // 超大屏上限制总像素数，别让填充率把帧率拖垮
  const want = cssW * cssH * dpr * dpr, cap = 3.2e6;
  if (want > cap) dpr = Math.max(1, dpr * Math.sqrt(cap / want));

  renderer.setSize(devW(), devH(), false);
  baseDist = computeBaseDist();
  allocateTargets();

  built.mats.forEach(m => { if (m.uniforms.uDpr) m.uniforms.uDpr.value = dpr; });
  fitText();
  dirty = true;
}

function bindInput(canvas){
  const pointers = new Map();
  let dragging = false, lastX = 0, lastY = 0, pinchDist = 0;

  canvas.addEventListener('pointerdown', e => {
    canvas.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if (pointers.size === 1){
      dragging = true; lastX = e.clientX; lastY = e.clientY;
      canvas.classList.add('dragging');
    } else if (pointers.size === 2){
      const [a, b] = [...pointers.values()];
      pinchDist = Math.hypot(a.x - b.x, a.y - b.y);
    }
  });

  canvas.addEventListener('pointermove', e => {
    if (!pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if (pointers.size === 2){
      const [a, b] = [...pointers.values()];
      const d = Math.hypot(a.x - b.x, a.y - b.y);
      if (pinchDist > 0){
        zoom = Math.min(CAM_ZOOM_MAX, Math.max(CAM_ZOOM_MIN, zoom * pinchDist / d));
      }
      pinchDist = d; dirty = true; return;
    }
    if (!dragging) return;
    const dx = e.clientX - lastX, dy = e.clientY - lastY;
    lastX = e.clientX; lastY = e.clientY;
    yaw += dx * DRAG_SENS;
    pitch = Math.min(CAM_PITCH_MAX, Math.max(CAM_PITCH_MIN, pitch + dy * DRAG_SENS));
    dirty = true;
  });

  const end = e => {
    pointers.delete(e.pointerId);
    if (pointers.size < 2) pinchDist = 0;
    if (pointers.size === 0){ dragging = false; canvas.classList.remove('dragging'); }
    if (pointers.size === 1){ const p = [...pointers.values()][0]; lastX = p.x; lastY = p.y; }
  };
  canvas.addEventListener('pointerup', end);
  canvas.addEventListener('pointercancel', end);

  canvas.addEventListener('wheel', e => {
    e.preventDefault();
    zoom = Math.min(CAM_ZOOM_MAX, Math.max(CAM_ZOOM_MIN, zoom * Math.exp(e.deltaY * 0.0008)));
    dirty = true;
  }, {passive:false});

  window.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft')  { yaw -= 4; dirty = true; }
    if (e.key === 'ArrowRight') { yaw += 4; dirty = true; }
    if (e.key === 'ArrowUp')    { pitch = Math.min(CAM_PITCH_MAX, pitch + 3); dirty = true; }
    if (e.key === 'ArrowDown')  { pitch = Math.max(CAM_PITCH_MIN, pitch - 3); dirty = true; }
  });
}

function frame(now){
  requestAnimationFrame(frame);
  if (!started) { lastMs = now; started = now; }
  let dt = (now - lastMs) * 0.001;
  lastMs = now;
  if (!(dt > 0)) dt = 0.016;
  if (dt > 0.1) dt = 0.1;                       // 切回标签页时别让动画跳一大步

  const t = (now - started) * 0.001;

  if (reduceMotion && !dirty) return;           // 静止画面就不必每帧重画
  dirty = false;

  angle = (angle + ROT_SPEED * dt) % 360;
  ringAngle = (ringAngle + RING_SPIN * dt) % 360;

  const b = built;
  b.spinning.rotation.y = angle * Math.PI / 180;
  b.flameGroup.rotation.y = angle * Math.PI / 180;
  b.ringGroup.rotation.y = ringAngle * Math.PI / 180;

  updateFlame(t, dt);
  b.flameRef.geo.attributes.position.needsUpdate = true;
  b.flameRef.geo.attributes.aColor.needsUpdate = true;

  b.mats.forEach(m => { if (m.uniforms.uTime) m.uniforms.uTime.value = t; });

  updateCamera();

  // —— 场景渲染到离屏 FBO ——
  renderer.setRenderTarget(rtScene);
  renderer.setClearColor(new THREE.Color(BG[0], BG[1], BG[2]), 1);
  renderer.clear(true, true, false);
  renderer.render(scene, camera);

  runBloom();
}


/* ══════════════════════════════════════════════════════════════════════════
   ⑨ 启动
   ══════════════════════════════════════════════════════════════════════════ */

function start(){
  if (!isWebGLAvailable()) throw new Error('no-webgl');
  if (typeof THREE === 'undefined') throw new Error('no-three');

  const canvas = document.getElementById('gl');

  reduceMotion = window.matchMedia &&
                 window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  cssW = Math.max(1, window.innerWidth);
  cssH = Math.max(1, window.innerHeight);
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  const want = cssW * cssH * dpr * dpr, cap = 3.2e6;
  if (want > cap) dpr = Math.max(1, dpr * Math.sqrt(cap / want));

  renderer = new THREE.WebGLRenderer({canvas:canvas, antialias:false, alpha:false,
                                      powerPreference:'high-performance'});
  renderer.autoClear = false;
  // 内部一律按设备像素算：pixelRatio 恒为 1，画布缓冲和每个 FBO 的视口
  // 就落在同一个坐标系里，不用去猜 three 在 setRenderTarget 里怎么换算。
  // DPR 只出现在一处 —— 顶点着色器里的 gl_PointSize。
  renderer.setPixelRatio(1);
  renderer.setSize(devW(), devH(), false);
  // 整条管线走原始数值，不插任何色彩空间转换 —— 和固定管线的算法逐位对齐
  if (THREE.ColorManagement) {
    if ('enabled' in THREE.ColorManagement) THREE.ColorManagement.enabled = false;
    if ('legacyMode' in THREE.ColorManagement) THREE.ColorManagement.legacyMode = true;
  }
  if ('outputEncoding' in renderer) renderer.outputEncoding = THREE.LinearEncoding;
  renderer.toneMapping = THREE.NoToneMapping;

  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(FOV, cssW / cssH, NEAR, FAR);
  baseDist = computeBaseDist();
  updateCamera();

  buildPost();
  built = build();
  allocateTargets();

  document.getElementById('keys').textContent =
    ('ontouchstart' in window) ? '拖动旋转 · 双指缩放' : '拖动旋转 · 滚轮缩放';
  document.getElementById('pcount').textContent = TOTAL.toLocaleString('en-US');

  bindInput(canvas);
  window.addEventListener('resize', onResize);
  if (window.matchMedia){
    const mq = window.matchMedia('(prefers-reduced-motion: reduce)');
    const onMq = () => { reduceMotion = mq.matches; dirty = true; };
    mq.addEventListener ? mq.addEventListener('change', onMq) : mq.addListener(onMq);
  }
  fitText();

  renderer.setRenderTarget(null);
  frame(performance.now());
}

// 问候语是按字形量出来再画进 canvas 的，字体没就位就会量成回退字体。
// Arial Narrow 是系统字体（Windows 上现成），Roboto Condensed 要下载 ——
// 没有 Arial Narrow 的机器上，第一帧量到的是普通无衬线，字会偏宽，
// 等窄体到了重画一次。画一张 canvas 就一毫秒，重画两次也不心疼。
function refreshGreet(){
  if (!built) return;
  try { fitText(); dirty = true; } catch (e){}
}
if (document.fonts){
  if (document.fonts.load){
    document.fonts.load(GREET_WEIGHT + ' ' + GREET_SIZE + 'px "Roboto Condensed"')
      .then(refreshGreet, refreshGreet);
  }
  if (document.fonts.ready) document.fonts.ready.then(refreshGreet, refreshGreet);
}

// 先让遮罩画出来，再做那几百毫秒的生成 —— 否则打开是一片空白
function boot(){
  requestAnimationFrame(() => requestAnimationFrame(() => {
    try {
      start();
      document.getElementById('veil').classList.add('gone');
    } catch (err){
      document.getElementById('veil').classList.add('gone');
      document.getElementById('fallback').classList.add('show');
      if (window.console) console.error(err);
    }
  }));
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();

})();
</script>
